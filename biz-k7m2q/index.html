<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Karton Barış</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: a cardboard puppet theater. Stage on top, a taped paper note under it, kraft board everywhere.
   Deliberately single-theme: the whole page is one piece of cardboard. */
:root{
  --kraft:#c79a66;
  --kraft-deep:#7f532d;
  --ink:#2a190e;
  --paper:#f8efdc;
  --curtain:#9a2e35;
  --tape:rgba(240,226,180,.82);
  --display:"Pixelify Sans", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  background-color:var(--kraft);
  background-image:repeating-linear-gradient(90deg, rgba(90,50,20,.07) 0 1px, transparent 1px 6px);
  color:var(--ink);
  font-family:var(--hand);
}
.wrap{
  max-width:760px;margin:0 auto;
  padding-block:16px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;gap:14px;
}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{margin:0;font-family:var(--display);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--kraft-deep)}
h1{
  margin:0;font-family:var(--display);font-weight:700;
  font-size:clamp(2rem,8vw,2.6rem);line-height:1;
  color:var(--paper);
  text-shadow:2px 2px 0 var(--kraft-deep),4px 4px 0 rgba(60,30,10,.35);
}
.theater{
  position:relative;
  border:6px solid var(--kraft-deep);
  border-radius:3px;
  background:#5a3a20;
  box-shadow:0 7px 0 rgba(60,30,10,.35);
}
.theater::before,.theater::after{
  content:"";position:absolute;top:-14px;width:72px;height:24px;background:var(--tape);
  box-shadow:0 1px 2px rgba(60,30,10,.25);z-index:2;pointer-events:none;
}
.theater::before{left:-18px;transform:rotate(-24deg)}
.theater::after{right:-18px;transform:rotate(21deg)}
#stage{
  display:block;width:100%;height:auto;aspect-ratio:3/2;max-width:100%;
  image-rendering:pixelated;
  cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.progress{height:4px;background:rgba(0,0,0,.35)}
.progress i{display:block;height:100%;width:0;background:#d6a547}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--display);font-size:.85rem;letter-spacing:.06em;color:var(--kraft-deep)}
.bar b{color:var(--ink);font-weight:700}
.note{
  position:relative;
  background:var(--paper);
  padding:14px 18px 12px;
  transform:rotate(-.5deg);
  box-shadow:0 2px 0 rgba(60,30,10,.18),0 10px 18px -12px rgba(60,30,10,.5);
  display:grid;gap:6px;
}
.note::before{
  content:"";position:absolute;top:-10px;left:50%;width:84px;height:20px;margin-left:-42px;
  background:var(--tape);transform:rotate(2deg);
}
.cap{margin:0;display:grid;font-size:clamp(1.45rem,5vw,1.8rem);line-height:1.2;max-width:34ch}
.cap>span{grid-area:1/1}
.cap .ghost{visibility:hidden}
.hint{margin:0;font-family:var(--display);font-size:.85rem;color:var(--curtain);letter-spacing:.03em}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{
  font-family:var(--display);font-weight:700;font-size:1rem;
  min-height:46px;padding:0 14px;
  background:var(--paper);color:var(--ink);
  border:2px solid var(--ink);border-radius:2px;
  box-shadow:3px 3px 0 var(--ink);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:3px solid var(--curtain);outline-offset:3px}
.btn.ready{background:var(--curtain);color:var(--paper)}
@media (prefers-reduced-motion: no-preference){
  .btn.ready{animation:nudge 1.4s ease-in-out infinite}
}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
</style>
</head>
<body style="margin:0">

<main class="wrap">
  <header>
    <h1>Biz</h1>
    <p class="eyebrow">karton kukla tiyatrosu</p>
  </header>

  <div class="theater">
    <canvas id="stage" role="img" aria-label="Karton kukla sahnesi"></canvas>
    <div class="progress"><i id="prog"></i></div>
  </div>

  <div class="bar"><span id="sceneNo">1 / 15</span><b id="sceneName">Perde</b></div>

  <div class="note">
    <p class="cap"><span class="ghost" id="capGhost"></span><span id="cap" aria-live="polite"></span></p>
    <p class="hint" id="hint" hidden></p>
  </div>

  <nav>
    <button class="btn" id="prev" type="button" aria-label="Önceki sahne">◀</button>
    <button class="btn" id="pause" type="button">❚❚ dur</button>
    <button class="btn" id="next" type="button" aria-label="Sonraki sahne">▶</button>
  </nav>
</main>

<script>
(() => {
const W = 384, H = 256, GROUND = 208;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// --- characters (colors from the photos) ---
const HIM = {
  skin:'#ebbd9a', shade:'#c98f6f', hair:'#221915', buzz:'#5d483c', brow:'#1c1410', style:'buzz',
  mustache:true, stubble:'#a17c66',
  shirt:'#1e1d24', sleeve:'#2a2932', sleeveBack:'#141318', zip:'#c9ccd4', emblem:'#d2383a',
  pants:'#34343f', shoes:'#0f0e12', mouth:'#a5524c', tall:true
};
const HER = {
  skin:'#f6d3bc', shade:'#e0ae94', hair:'#1a2858', hairHi:'#3553a8', brow:'#2a2a4a', style:'long', cheeks:true,
  flower:'#f2669a', flowerDot:'#b51d5a',
  shirt:'#141318', sleeve:'#f6d3bc', sleeveBack:'#e0ae94',
  pants:'#2a2c3d', shoes:'#1a1214', mouth:'#cc4f5c', tall:false
};

// --- canvases ---
const view = document.getElementById('stage');
const vctx = view.getContext('2d');
let S = 3, CX0 = 0, CW = W;
function mk(w=W,h=H){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
const comp=mk(), cctx=comp.getContext('2d');
const spr=mk(), sctx=spr.getContext('2d');
const sil=mk(), silctx=sil.getContext('2d');
const bg=mk(), bgctx=bg.getContext('2d');
const tmp=mk(96,96), tctx=tmp.getContext('2d');
[cctx,sctx,silctx,bgctx,tctx].forEach(c=>c.imageSmoothingEnabled=false);

function fit(){
  // portrait phones get a closer camera: the middle 288px of the stage, so faces read bigger
  const narrow=innerWidth<640&&innerHeight>innerWidth;
  CW=narrow?288:W; CX0=(W-CW)/2;
  view.style.aspectRatio=CW+'/'+H;
  const cssW=view.getBoundingClientRect().width||600, dpr=window.devicePixelRatio||1;
  const s=Math.max(2,Math.min(7,Math.ceil(cssW*dpr/CW)));
  if(s!==S||view.width!==CW*s){ S=s; view.width=CW*S; view.height=H*S; }
  vctx.imageSmoothingEnabled=false;
}
fit();
addEventListener('resize',fit);

// --- pixel helpers ---
function px(c,x,y,w,h,col){ c.fillStyle=col; c.fillRect(Math.round(x),Math.round(y),w,h); }
function rnd(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
const lerp=(a,b,k)=>a+(b-a)*k;
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function pline(c,x0,y0,x1,y1,col,w=1){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let e=dx+dy; c.fillStyle=col;
  for(let n=0;n<2000;n++){ c.fillRect(x0,y0,w,w); if(x0===x1&&y0===y1)break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} }
}
function circle(c,x,y,r,col){
  c.fillStyle=col; x=Math.round(x); y=Math.round(y);
  for(let dy=-r;dy<=r;dy++){ const w=Math.floor(Math.sqrt(r*r-dy*dy)); c.fillRect(x-w,y+dy,2*w+1,1); }
}
function pat(c,x,y,rows,map,s=2){
  rows.forEach((row,j)=>{ for(let i=0;i<row.length;i++){ const col=map[row[i]]; if(col) px(c,x+i*s,y+j*s,s,s,col); } });
}
const HEART_ROWS=['XX.XX','XXXXX','.XXX.','..X..'];
function heartSmall(c,x,y,col,s=2){ pat(c,Math.round(x),Math.round(y),HEART_ROWS,{X:col},s); }

// cardboard cut-out look: dark drop shadow + cream paper edge around everything on a layer
const OFFS=[];
for(let ox=-2;ox<=2;ox++) for(let oy=-2;oy<=2;oy++) if((ox||oy)&&Math.abs(ox)+Math.abs(oy)<=3) OFFS.push([ox,oy]);
function outlineInto(dst,src,sa=.35){
  silctx.globalCompositeOperation='source-over'; silctx.clearRect(0,0,W,H); silctx.drawImage(src,0,0);
  silctx.globalCompositeOperation='source-in'; silctx.fillStyle='#3d220d'; silctx.fillRect(0,0,W,H);
  dst.globalAlpha=sa; dst.drawImage(sil,3,4); dst.globalAlpha=1;
  silctx.fillStyle='#f6e8cc'; silctx.fillRect(0,0,W,H);
  for(const [ox,oy] of OFFS) dst.drawImage(sil,ox,oy);
  silctx.globalCompositeOperation='source-over';
  dst.drawImage(src,0,0);
}

// --- puppets ---
function stick(c,X,y){ px(c,X-2,y,4,H-y,'#7b4f27'); px(c,X-2,y,1,H-y,'#9a6a3a'); }

function drawSword(c,hx,hy,a,dir){
  const dx=dir*Math.cos(a),dy=Math.sin(a),gx=-dy,gy=dx;
  for(let i=-5;i<0;i++) px(c,hx+dx*i-1,hy+dy*i-1,2,2,'#6b3e1f');
  for(let i=-5;i<=5;i++) px(c,hx+dx*2+gx*i-1,hy+dy*2+gy*i-1,2,2,'#d8a440');
  for(let i=4;i<=28;i++){ px(c,hx+dx*i+gx*1.5-1,hy+dy*i+gy*1.5-1,2,2,'#98a4b4'); px(c,hx+dx*i-1,hy+dy*i-1,2,2,'#eef2f7'); }
}

function drawArm(c,p,X,dxS,sy,a,back){
  const k=p.cfg,L=p.armLen||12,dir=p.dir;
  const sx=dir===1?X+dxS:X-dxS-4, cx=dir*Math.cos(a), cy=Math.sin(a);
  for(let i=0;i<=12;i++){ const t=i/12; px(c,sx+cx*L*t,sy+cy*L*t,4,4,t<.62?(back?k.sleeveBack:k.sleeve):(back?k.shade:k.skin)); }
  const hx=sx+2+cx*L, hy=sy+2+cy*L;
  if(p.sword&&!back) drawSword(c,hx,hy,a+(p.swordOff??-.5),dir);
  return {hx,hy};
}

function drawHead(c,k,X,ht,dir,face,o={}){
  const r=(dx,yy,w,h,col)=>px(c,dir===1?X+dx:X-dx-w,yy,w,h,col);
  const sh=o.front?0:2, E='#1a120e', long=k.style==='long';
  if(long&&o.hairLen!==0) r(-14,ht+2,28,o.hairLen||24,k.hair);
  if(!long){ r(-14,ht+9,3,6,k.skin); r(-14,ht+10,1,4,k.shade); r(11,ht+9,3,6,k.skin); r(13,ht+10,1,4,k.shade); }
  r(-10,ht,20,21,k.skin); r(-12,ht+3,24,15,k.skin); r(-11,ht+1,22,19,k.skin);
  if(k.cheeks){ r(-13,ht+10,26,7,k.skin); r(-12,ht+17,24,2,k.skin); }
  if(k.stubble){
    for(let j=ht+15;j<=ht+20;j++) for(let i=-11;i<=10;i++){
      if((i+j)%2===0&&rnd(i*31+j*7)<.6&&(j>ht+16||i<-6||i>6)) r(i,j,1,1,k.stubble);
    }
  }
  const ex1=-6+sh, ex2=3+sh;
  if(o.shades){ r(ex1-2,ht+8,15,5,'#111014'); r(ex1-1,ht+9,2,1,'#5a5f70'); r(ex2,ht+9,2,1,'#5a5f70'); }
  else if(face==='happy'){ for(const ex of [ex1,ex2]){ r(ex,ht+11,1,1,E); r(ex+1,ht+10,2,1,E); r(ex+3,ht+11,1,1,E); } }
  else if(face==='tired'){ for(const ex of [ex1,ex2]) r(ex,ht+11,4,1,E); }
  else {
    for(const ex of [ex1,ex2]){ r(ex,ht+9,3,4,E); r(ex+1,ht+9,1,1,'#ffffff'); }
    if(long){ r(ex1-1,ht+9,1,1,E); r(ex2+3,ht+9,1,1,E); }
  }
  // brows
  if(face==='angry'){
    r(ex1-1,ht+5,2,2,k.brow); r(ex1+1,ht+6,3,2,k.brow);
    r(ex2-1,ht+6,3,2,k.brow); r(ex2+2,ht+5,2,2,k.brow);
  } else if(face==='sad'||face==='shy'){
    r(ex1-1,ht+7,2,1,k.brow); r(ex1+1,ht+6,3,1,k.brow); r(ex2-1,ht+6,3,1,k.brow); r(ex2+2,ht+7,2,1,k.brow);
  } else if(!long){ r(ex1-1,ht+6,5,2,k.brow); r(ex2-1,ht+6,5,2,k.brow); }
  else { r(ex1,ht+7,4,1,k.brow); r(ex2,ht+7,4,1,k.brow); }
  r(sh,ht+13,2,2,k.shade);
  if(k.cheeks||face==='happy'||face==='shy'||o.blush){ r(ex1-2,ht+14,4,2,'#f29696'); r(ex2+1,ht+14,4,2,'#f29696'); }
  if(k.mustache){ r(sh-6,ht+15,13,2,k.hair); r(sh-7,ht+16,2,2,k.hair); r(sh+6,ht+16,2,2,k.hair); }
  const m=k.mustache?ht+18:ht+17, mc=k.mouth;
  if(face==='happy'){ r(sh-2,m-1,1,1,mc); r(sh-1,m,4,1,mc); r(sh+3,m-1,1,1,mc); }
  else if(face==='tired'||face==='open'){ r(sh-1,m-1,3,3,'#5b2424'); }
  else if(face==='angry'){ r(sh-2,m,6,1,'#5b2424'); }
  else if(face==='pout'){ r(sh,m,2,2,mc); }
  else { r(sh-1,m,4,1,mc); if(long) r(sh,m+1,2,1,mc); }
  // hair
  if(!long){
    r(-9,ht-1,18,1,k.hair); r(-11,ht,22,4,k.hair); r(-12,ht+3,24,3,k.hair); r(-12,ht+6,2,4,k.hair); r(10,ht+6,2,3,k.hair);
    for(let j=ht-1;j<ht+6;j++) for(let i=-11;i<=10;i++) if(rnd(i*13+j*3)<.2) r(i,j,1,1,k.buzz);
  } else {
    r(-11,ht-2,22,3,k.hair); r(-13,ht+1,26,5,k.hair);
    r(-14,ht+5,4,o.hairLen===0?24:16,k.hair); r(10,ht+5,4,o.hairLen===0?22:14,k.hair);
    r(-11,ht+5,16,2,k.hair); r(-11,ht+7,9,1,k.hair); r(-11,ht+8,5,1,k.hair);
    r(-6,ht-1,6,1,k.hairHi); r(-12,ht+7,1,10,k.hairHi); r(11,ht+9,1,9,k.hairHi);
    if(!o.noFlower) pat(c,dir===1?X-15:X+6,ht-1,['.P.P.','PPDPP','.PPP.'],{P:k.flower,D:k.flowerDot},2);
  }
  if(o.mess){
    const sd=o.seed||0;
    for(let i=0;i<10;i++){
      const rx=-13+Math.floor(rnd(i+sd)*26), ry=ht-6+Math.floor(rnd(i*7+sd+3)*6);
      r(rx,ry,2,2,k.hair); if(i%2) r(rx+(i%3-1)*2,ry-2,2,2,k.hair);
    }
  }
  return {mx:dir===1?X+sh+1:X-sh-1, my:m};
}

function drawPerson(c,o){
  const p=Object.assign({legs:'stand',armF:1.3,armB:1.6,face:'neutral',bob:0,lift:0,stick:true},o);
  const k=p.cfg, dir=p.front?1:p.dir, X=Math.round(p.x), y=Math.round(p.y+p.lift);
  const r=(dx,yy,w,h,col)=>px(c,dir===1?X+dx:X-dx-w,yy,w,h,col);
  const hip={crouch:y-7,jump:y-13,sitGround:y-3,sitBench:y}[p.legs] ?? y-10;
  if(p.stick) stick(c,X,hip+2);
  const th=k.tall?17:15, top=hip-th+p.bob, ht=top-20;
  const pp=Object.assign({},p,{dir});
  if(k.style==='long') r(-14,ht+2,28,top+14-ht-2,k.hair);
  if(!p.front) drawArm(c,pp,X,-9,top+3,p.armB,true);
  switch(p.legs){
    case 'crouch': r(-9,hip,6,4,k.pants); r(-9,y-3,8,3,k.shoes); r(3,hip,6,4,k.pants); r(3,y-3,8,3,k.shoes); break;
    case 'jump': r(-8,hip,6,7,k.pants); r(-10,hip+7,7,3,k.shoes); r(2,hip+2,9,5,k.pants); r(10,hip+1,3,7,k.shoes); break;
    case 'sitGround': r(-4,y-8,20,6,k.pants); r(16,y-12,5,10,k.shoes); break;
    case 'sitBench': r(-4,y-6,17,6,k.pants); r(8,y,6,p.shin,k.pants); r(8,y+p.shin,9,3,k.shoes); break;
    default: {
      let o1=0,o2=0,l1=0,l2=0;
      if(p.legs==='walk'){ const s=Math.sin(p.phase||0); o1=Math.round(s*3); o2=-o1; l1=s>.3?2:0; l2=s<-.3?2:0; }
      r(-7+o1,hip-l1,6,y-3-hip,k.pants); r(-7+o1,y-3-l1,8,3,k.shoes);
      r(1+o2,hip-l2,6,y-3-hip,k.pants); r(1+o2,y-3-l2,8,3,k.shoes);
    }
  }
  r(-9,top+1,18,th-1,k.shirt); r(-8,top,16,1,k.shirt);
  if(k.zip){
    const zx=p.front?0:2;
    r(-9,top-2,8,3,k.sleeve); r(-9,top+th-2,18,2,k.sleeveBack);
    r(zx,top+2,1,th-4,k.zip); r(zx-1,top+2,3,2,k.zip);
    r(-6,top+8,3,4,k.emblem); r(-3,top+9,3,4,k.emblem); r(-5,top+4,1,4,'#e9e2d0'); r(-2,top+5,1,4,'#e9e2d0');
  }
  if(k.style==='long'){
    r(-2,top,6,2,k.skin); r(-1,top+2,4,2,k.skin); r(0,top+4,2,2,k.skin);
    r(-13,top,4,10,k.hair); r(9,top,4,7,k.hair); r(-12,top+1,1,7,k.hairHi);
  }
  const head=drawHead(c,k,X,ht,dir,p.face,Object.assign({},p,{hairLen:0}));
  let hand=null;
  if(p.front){
    drawArm(c,Object.assign({},pp,{dir:-1}),X,9,top+3,p.armB,false);
    hand=drawArm(c,pp,X,9,top+3,p.armF,false);
  } else if(!p.skipFront) hand=drawArm(c,pp,X,5,top+3,p.armF,false);
  return {X,top,ht,hip,dir,hand,mx:head.mx,my:head.my};
}

// draw a puppet into a scratch canvas, then lay it down (90° turns keep pixels exact)
function drawLying(o,x,y,rot){
  tctx.clearRect(0,0,96,96);
  drawPerson(tctx,Object.assign({x:48,y:84,stick:false},o));
  sctx.save(); sctx.translate(x,y); sctx.rotate(rot); sctx.drawImage(tmp,-48,-48); sctx.restore();
}

// --- scenery ---
function kraft(c){
  c.fillStyle='#c99f6e'; c.fillRect(0,0,W,H);
  for(let x=0;x<W;x++){
    const m=x%6;
    if(m===0){ c.fillStyle='rgba(80,45,15,.10)'; c.fillRect(x,0,1,H); }
    else if(m===3){ c.fillStyle='rgba(255,235,200,.07)'; c.fillRect(x,0,1,H); }
  }
  for(let i=0;i<900;i++){
    c.fillStyle=i%2?'rgba(70,40,10,.12)':'rgba(255,240,210,.10)';
    c.fillRect(Math.floor(rnd(i*1.7)*W),Math.floor(rnd(i*2.3+5)*H),1,1);
  }
}

const POOL={x0:112,x1:270,y0:156,y1:190};
const POCKETS=[[108,152],[191,151],[274,152],[108,194],[191,195],[274,194]];
const BALLCOL=['#e2b23a','#c0392b','#2d5bbf','#151515','#7d3c98','#e67e22'];
function rack(st){
  const pos=[[236,173],[244,168],[244,178],[252,163],[252,173],[252,183]];
  st.balls=[{x:146,y:173,c:'#f6f3ea',cue:true}].concat(pos.map((p,i)=>({x:p[0],y:p[1],c:BALLCOL[i]}))).map(b=>Object.assign(b,{vx:0,vy:0,in:false}));
  st.phase='aim'; st.phaseT=st.now||0;
}
function poolStep(st,dt){
  const B=st.balls.filter(b=>!b.in);
  for(const b of B){
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    const f=Math.pow(.4,dt); b.vx*=f; b.vy*=f;
    if(Math.hypot(b.vx,b.vy)<5){ b.vx=0; b.vy=0; }
    if(b.x<POOL.x0){ b.x=POOL.x0; b.vx=Math.abs(b.vx)*.8; } if(b.x>POOL.x1){ b.x=POOL.x1; b.vx=-Math.abs(b.vx)*.8; }
    if(b.y<POOL.y0){ b.y=POOL.y0; b.vy=Math.abs(b.vy)*.8; } if(b.y>POOL.y1){ b.y=POOL.y1; b.vy=-Math.abs(b.vy)*.8; }
    for(const [qx,qy] of POCKETS) if(Math.hypot(b.x-qx,b.y-qy)<8){ b.in=true; b.vx=b.vy=0; st.potted.push(b); }
  }
  for(let i=0;i<B.length;i++) for(let j=i+1;j<B.length;j++){
    const a=B[i], b=B[j]; if(a.in||b.in) continue;
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
    if(d>0&&d<7){
      const nx=dx/d, ny=dy/d, rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(rel>0){ a.vx-=rel*nx; a.vy-=rel*ny; b.vx+=rel*nx; b.vy+=rel*ny; }
      const o=(7-d)/2; a.x-=nx*o; a.y-=ny*o; b.x+=nx*o; b.y+=ny*o;
    }
  }
}
function poolShoot(st,t){
  const cue=st.balls[0], targets=st.balls.filter(b=>!b.cue&&!b.in);
  if(!targets.length) return;
  const tg=targets[Math.floor(Math.random()*targets.length)];
  const dx=tg.x-cue.x, dy=tg.y-cue.y, d=Math.hypot(dx,dy)||1;
  cue.vx=dx/d*260; cue.vy=dy/d*260;
  st.shooter=cue.x<191?'him':'her'; st.phase='roll'; st.phaseT=t; st.potted=[];
}

    tap(t,st){ st.taps=(st.taps||0)+1; if(st.done) for(let i=0;i<6;i++) emitHeart(st,192+(Math.random()-.5)*60,80,t); },
    draw(t,st){
      const n=Math.min(3,Math.max(0,Math.floor((t-.8)/1.3))+(st.taps||0));
      if(st.n!==n){ (st.tapeT=st.tapeT||[])[n-1]=t; st.n=n; }
      st.g=lerp(st.g??14,[14,9,4,0][n],.12);
      const done=n>=3&&st.g<.5;
      if(done&&!st.done){ st.done=true; next.classList.add('ready'); }
      circle(sctx,88,198,8,'#e8d9a8'); circle(sctx,88,198,4,'#9b6c41');
      const reach=done?-.9:-.6;
      drawPerson(sctx,{cfg:HIM,x:128,y:GROUND,dir:1,face:done?'happy':'neutral',armF:reach,armB:1.6});
      drawPerson(sctx,{cfg:HER,x:256,y:GROUND,dir:-1,face:done?'happy':'neutral',armF:reach,armB:1.6});
      const g=Math.round(st.g), cx=192, cy=108-(done&&Math.floor(t*2)%2?2:0);
      sctx.drawImage(HL,cx-50-g,cy-44+Math.round(g*.3)); sctx.drawImage(HR,cx-50+g,cy-44);
      [-20,2,22].forEach((j,k)=>{
        if(k>=n) return;
        const x=cx+HL.cr(j)-14, y=cy+j-4, fresh=t-((st.tapeT||[])[k]||0)<.15;
        px(sctx,x,y,28,8,fresh?'#fffbe9':'#ecdcae'); px(sctx,x,y,28,2,fresh?'#fffbe9':'#f6ead0');
        for(let q=0;q<8;q+=4){ sctx.clearRect(x,y+q,2,2); sctx.clearRect(x+26,y+q+2,2,2); }
      });
      if(done){
        st.nextH=st.nextH??t;
        if(t>=st.nextH){ emitHeart(st,cx+(Math.random()-.5)*70,cy-36,t); st.nextH=t+.7; }
        fx.push(()=>{ for(let i=0;i<8;i++){ if((Math.floor(t*4)+i)%3) continue; const a=i/8*Math.PI*2; px(cctx,cx+Math.cos(a)*62,cy+Math.sin(a)*50,2,2,'#fff6d0'); } });
      }
    }
  }
];

// shared concert scene
for(const s of scenes) if(s.concert){
  const C=s.concert;
  s.bg={tint:'rgba(20,14,40,.74)',hills:false,stars:true,props(c){
    px(c,176,128,208,12,'#2b2230'); px(c,180,54,152,28,'#14121c'); px(c,180,54,152,2,'#c9a24a'); px(c,180,80,152,2,'#c9a24a');
  },ground(c){ px(c,0,GROUND,W,H-GROUND,'#2a2030'); }};
  s.hint='▸ dokun';
  s.tap=(t,st)=>{ st.jump=t; for(let i=0;i<40;i++) st.conf.push({x:150+Math.random()*230,y:-4,vx:(Math.random()-.5)*30,vy:20+Math.random()*40,t0:t,col:['#f2669a','#ffd84a','#7fd6e8','#f6f2e6'][i%4]}); };
  s.under=(t)=>{
    C.beams.forEach((col,i)=>{
      const ox=200+i*50, ang=Math.sin(t*.9+i*2)*.4, ex=ox+Math.tan(ang)*200;
      cctx.fillStyle=col; cctx.beginPath(); cctx.moveTo(ox,14); cctx.lineTo(ex-28,210); cctx.lineTo(ex+28,210); cctx.closePath(); cctx.fill();
    });
  };
  s.draw=(t,st)=>{
    st.conf=st.conf||[];
    const beat=Math.floor(t*C.beat*2);
    say(C.name,256,68,9.5,C.textCol);
    [214,258,302].forEach((x,i)=>{
      const y=128-((beat+i)%2)*2;
      px(sctx,x-6,y-24,12,16,'#120f18'); circle(sctx,x,y-30,5,'#120f18'); px(sctx,x-5,y-8,4,8,'#120f18'); px(sctx,x+1,y-8,4,8,'#120f18');
      if(i!==1){ px(sctx,x-10,y-16,16,4,'#4a3020'); circle(sctx,x-8,y-13,4,'#4a3020'); }
      else { px(sctx,x+9,y-34,2,34,'#2a2a2a'); px(sctx,x+7,y-36,6,4,'#555'); }
    });
    const jump=st.jump!=null&&t-st.jump<.35?-Math.sin((t-st.jump)/.35*Math.PI)*10:0;
    const sway=Math.round(Math.sin(t*C.beat*Math.PI)*2);
    const b=drawPerson(sctx,{cfg:HER,x:116+sway,y:GROUND,lift:jump,dir:1,face:'happy',armF:-1.35,armB:1.5,bob:(beat%2)*2});
    drawPerson(sctx,{cfg:HIM,x:94+sway,y:GROUND,lift:jump,dir:1,face:'happy',armF:.05,armB:1.5,bob:((beat+1)%2)*2});
    for(let i=0;i<11;i++){
      const x=158+i*22, y=196+((beat+i)%2)*2;
      circle(sctx,x,y,9,'#3a2840'); px(sctx,x-13,y+6,26,12,'#3a2840');
    }
    fx.push(()=>{
      const hx=b.hand.hx, hy=b.hand.hy;
      if(C.light==='phone'){ px(cctx,hx-2,hy-6,5,8,'#1b1b1b'); px(cctx,hx-1,hy-6,2,2,'#ffffff'); cctx.fillStyle='rgba(255,255,240,.25)'; cctx.fillRect(hx-4,hy-10,9,6); }
      else { px(cctx,hx-2,hy-4,4,6,'#c0392b'); const f=Math.floor(t*12)%2; px(cctx,hx-1,hy-8-f,2,4,'#ffd84a'); px(cctx,hx,hy-9-f,1,2,'#fff6d0'); }
      st.conf=st.conf.filter(c=>t-c.t0<3);
      for(const c of st.conf){ const a=t-c.t0; px(cctx,c.x+c.vx*a+Math.sin(a*6+c.x)*3,c.y+c.vy*a+20*a*a,2,2,c.col); }
    });
    for(let i=0;i<4;i++){ const a=(t*.6+i*.25)%1; say(i%2?'♪':'♫',196+i*36+Math.sin(t*2+i)*6,120-a*70,11,C.textCol); }
  };
}

// --- app state ---
const N=scenes.length;
const $=id=>document.getElementById(id);
const cap=$('cap'), capGhost=$('capGhost'), hint=$('hint'), next=$('next'), prev=$('prev'), pauseBtn=$('pause'), prog=$('prog');
let cur=0, st={parts:[]}, t0=performance.now(), open=0, trans={phase:'open',start:performance.now()+600}, paused=false;

let typeTimer;
function typeCaption(txt){
  clearInterval(typeTimer); capGhost.textContent=txt;
  if(reduce){ cap.textContent=txt; return; }
  let i=0; cap.textContent='';
  typeTimer=setInterval(()=>{ i++; cap.textContent=txt.slice(0,i); if(i>=txt.length) clearInterval(typeTimer); },40);
}
function setScene(i){
  cur=i; st={parts:[],extra:0}; t0=performance.now();
  makeBg(scenes[i].bg);
  $('sceneNo').textContent=`${i+1} / ${N}`;
  $('sceneName').textContent=scenes[i].name;
  typeCaption(scenes[i].caption);
  hint.textContent=scenes[i].hint||''; hint.hidden=!scenes[i].hint;
  prev.disabled=i===0;
  next.textContent=i===N-1?'↺':'▶';
  next.setAttribute('aria-label',i===N-1?'Baştan başlat':'Sonraki sahne');
  next.classList.remove('ready');
}
function go(i){
  if(trans) return;
  if(i>=N) i=0;
  if(i<0) return;
  trans={phase:'close',start:performance.now(),next:i};
}
function setPaused(p){ paused=p; pauseBtn.textContent=p?'▶ oynat':'❚❚ dur'; }

prev.addEventListener('click',()=>go(cur-1));
next.addEventListener('click',()=>go(cur+1));
pauseBtn.addEventListener('click',()=>setPaused(!paused));
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(cur+1); if(e.key==='ArrowLeft') go(cur-1); });
let down=null;
view.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; });
view.addEventListener('pointerup',e=>{
  if(!down) return;
  const dx=e.clientX-down.x, dy=e.clientY-down.y; down=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){ go(cur+(dx<0?1:-1)); return; }
  if(trans) return;
  const rect=view.getBoundingClientRect(), t=(performance.now()-t0)/1000;
  const x=CX0+(e.clientX-rect.left)/rect.width*CW, y=(e.clientY-rect.top)/rect.height*H;
  emitHeart(st,x-5,y-4,t,0);
  const s=scenes[cur];
  if(s.tap) s.tap(t,st);
  st.extra=Math.min(8,st.extra+2);
});
cap.parentElement.addEventListener('click',()=>{ clearInterval(typeTimer); cap.textContent=scenes[cur].caption; });

function frame(now){
  requestAnimationFrame(frame);
  if(trans){
    const e=(now-trans.start)/1000;
    if(trans.phase==='close'){
      open=Math.max(0,1-e/.35);
      if(e>=.35){ setScene(trans.next); trans={phase:'open',start:now}; }
    } else {
      open=ease(e/.7);
      if(e>=.7){ open=1; trans=null; }
    }
  }
  const s=scenes[cur], t=(now-t0)/1000, total=s.dur+st.extra;
  if(!trans&&!paused&&cur<N-1&&t>total) go(cur+1);
  prog.style.width=(isFinite(total)?Math.min(100,t/total*100):100)+'%';
  cctx.drawImage(bg,0,0);
  if(s.under) s.under(t,st);
  sctx.clearRect(0,0,W,H); fx.length=0; texts.length=0;
  s.draw(t,st);
  drawParts(st,t);
  outlineInto(cctx,spr);
  fx.forEach(f=>f());
  drawCurtains(cctx,open);
  vctx.imageSmoothingEnabled=false;
  vctx.drawImage(comp,CX0,0,CW,H,0,0,CW*S,H*S);
  if(open>.6) texts.forEach(drawText);
}
setScene(0);
requestAnimationFrame(frame);
})();
</script>
